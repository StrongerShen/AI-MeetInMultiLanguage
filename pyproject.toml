[project]
name = "ai-meet-in-multi-language"
version = "0.1.0"
description = "中、英、日、臺語混合會議的逐字稿與摘要品質原型"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "anyio>=4.8,<4.10",
  "fastapi>=0.115,<0.116",
  "openai>=1.109,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.34,<1",
]

[project.scripts]
meet-eval = "meet_in_multi_language.cli:main"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meet_in_multi_language"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
